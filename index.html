<!doctype html>
<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shanaya T. Concibido - Information Technology Student Portfolio & ATS Web Resume." />

    <!-- Google Fonts: Inter & JetBrains Mono for pristine ATS typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#fff6f8] dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-pink-200 selection:text-pink-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
